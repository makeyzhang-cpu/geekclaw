[package]
name = "geekclaw-tools"
description = "Built-in agent tools for GeekClaw (Read, Write, Edit, Bash, Grep, Glob, Delegate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Cross-platform test fixture spawned by the PTY/process unit tests (replaces
# the unix-only `cat`/`sleep`/`sh` programs). Built with the crate so unit tests
# in `src/` can locate it next to the test runner via `current_exe()`.
[[bin]]
name = "pty_test_helper"
path = "src/bin/pty_test_helper.rs"

[dependencies]
geekclaw-types.workspace    = true
geekclaw-protocol.workspace = true
geekclaw-config.workspace   = true
geekclaw-process-runtime.workspace = true

tracing.workspace     = true
tokio.workspace       = true
tokio-util.workspace  = true
serde.workspace       = true
serde_json.workspace  = true
jsonschema.workspace  = true
async-trait.workspace = true
sha2.workspace        = true
base64.workspace      = true
glob.workspace        = true
lru.workspace         = true
libc.workspace        = true
uuid.workspace        = true
which.workspace       = true
tempfile.workspace    = true


[dev-dependencies]
portable-pty.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
