    h+='<td><input class="input-field input-field-xs" value="'+esc(it.hsCode)+'" onchange="window._piItem('+idx+',\'hsCode\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" type="number" min="0" value="'+esc(it.qty)+'" onchange="window._piItem('+idx+',\'qty\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.unitOfMeasure)+'" onchange="window._piItem('+idx+',\'unitOfMeasure\',this.value)"></td>';

    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc(it.totalAmount)+'" readonly style="background:var(--bg);"></td>';

  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';

  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总重量':'Total Weight')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalWeight||'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总金额':'Total Invoice Value')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalInvoiceValue||'—')+'</span></div>';
  h+='</div></div>';

  h+=lI(isZh?'总金额':'Total Invoice Value',d.totalInvoiceValue,'totalInvoiceValue','');h+='</div></div>';
  // Declaration & Signature

  h+='<div><div class="form-label">'+(isZh?'声明内容':'Declaration')+'</div><textarea class="input-field" rows="3" onchange="window._piSet(\'declaration\',this.value)">'+esc(d.declaration)+'</textarea></div>';

  h+=lI(isZh?'签名人':'Signatory',d.signatureName,'signatureName','');h+=lI(isZh?'职务':'Title',d.signatureTitle,'signatureTitle','');
  h+=lID(isZh?'签名日期':'Date',d.signatureDate,'signatureDate');h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;

function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  if(d.logo)h+='<div style="text-align:center;margin-bottom:16px;"><img src="'+esc(d.logo)+'" style="max-height:50px;"></div>';
  h+='<div class="header-title">'+tr2('PROFORMA INVOICE','形式发票')+'</div>';
  h+='<table><tbody><tr><td style="width:50%;"><div class="section-label2">'+tr2('SELLER','卖方')+'</div>';
  h+='<div class="section-value">'+esc(d.sellerName||'—')+'</div><div class="section-value">'+esc(d.sellerAddress||'—')+'</div>';
  if(d.sellerPhone)h+='<div class="section-value">Tel: '+esc(d.sellerPhone)+'</div>';
  if(d.sellerTaxId)h+='<div class="section-value">Tax ID: '+esc(d.sellerTaxId)+'</div>';
  h+='</td><td style="width:50%;"><div class="section-label2">'+tr2('BUYER','买方')+'</div>';
  h+='<div class="section-value">'+esc(d.buyerName||'—')+'</div>';
  if(d.buyerCompany)h+='<div class="section-value">'+esc(d.buyerCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.buyerAddress||'—')+'</div>';
  if(d.buyerPhone)h+='<div class="section-value">Tel: '+esc(d.buyerPhone)+'</div>';
  h+='</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('PROFORMA INV. NO.','形式发票号'),tr2('PO NO.','订单号'),tr2('DATE OF ISSUE','开证日期'),tr2('CURRENCY','货币'),tr2('PAYMENT TERMS','付款条款')].forEach(function(t){h+='<th style="width:20%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.proformaInvoiceNo,d.poNo,d.dateOfIssue,d.currency,d.paymentTerms].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('ITEM NO.','项号'),tr2('DESCRIPTION','描述'),tr2('HS CODE','HS编码'),tr2('QTY','数量'),tr2('UNIT','单位'),tr2('UNIT PRICE','单价'),tr2('TOTAL AMOUNT','金额')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td class="text-center">'+esc(it.itemNo||'—')+'</td><td>'+esc(it.description||'—')+'</td><td class="text-center">'+esc(it.hsCode||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.qty||'—')+'</td><td class="text-center">'+esc(it.unitOfMeasure||'—')+'</td>';
    h+='<td class="text-right">'+esc(it.unitPrice||'—')+'</td><td class="text-right">'+esc(it.totalAmount||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="mt-2" style="display:flex;justify-content:space-between;">';
  h+='<div><div class="section-label2">'+tr2('DECLARATION','声明')+'</div><div class="section-value">'+esc(d.declaration)+'</div></div>';

  h+='<div class="section-value">'+esc(d.signatureName||'—')+'</div><div class="section-value">'+esc(d.signatureTitle||'')+'</div>';
  h+='<div class="section-value">'+esc(d.signatureDate||'')+'</div></div></div>';

function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._piRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._piDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._piClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._piSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._piItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);saveDocData(DT,data);};
window._piAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._piRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._piRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._piDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._piClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
window._piLogoUpload=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){data.logo=ev.target.result;saveDocData(DT,data);renderForm();};r.readAsDataURL(f);};
window._piRemoveLogo=function(){data.logo='';saveDocData(DT,data);renderForm();};
