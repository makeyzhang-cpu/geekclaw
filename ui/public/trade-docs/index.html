<script src="common.js"></script>
<script>
// Initialize theme
applyTheme();

// Render page
function render() {
  const lang = getLang();
  const dark = isDark();
  const tr = I18N[lang];
  const isZh = lang === 'zh';

  // Update lang attribute
  document.documentElement.lang = lang;

  // Logo icon
  document.getElementById('logo-icon').innerHTML = svg('FileStack', 28);

  // Language button
  document.getElementById('lang-icon').innerHTML = svg('Languages', 16);
  document.getElementById('lang-label').textContent = isZh ? 'EN' : '中文';

  // Theme button
  document.getElementById('theme-icon').innerHTML = svg(dark ? 'Sun' : 'Moon', 16);
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';

  // Hero
  document.getElementById('hero-badge-text').textContent = isZh ? tr.badge : tr.badgeEn;
  document.getElementById('hero-icon').innerHTML = svg('FileStack', 36, dark ? '#818cf8' : '#7c3aed');
  document.getElementById('hero-title').textContent = isZh ? tr.heroTitle : tr.heroTitleEn;
  document.getElementById('hero-desc').textContent = isZh ? tr.heroDesc : tr.heroDescEn;

  // Features
  const features = [
    { icon: 'ShieldCheck', label: isZh ? tr.featCustoms : tr.featCustomsEn, desc: isZh ? tr.featCustomsDesc : tr.featCustomsDescEn, color: '#16a34a' },
    { icon: 'FileOutput', label: isZh ? tr.featPdf : tr.featPdfEn, desc: isZh ? tr.featPdfDesc : tr.featPdfDescEn, color: '#dc2626' },
    { icon: 'Globe2', label: isZh ? tr.featBilingual : tr.featBilingualEn, desc: isZh ? tr.featBilingualDesc : tr.featBilingualDescEn, color: '#d97706' },
    { icon: 'Database', label: isZh ? tr.featLocal : tr.featLocalEn, desc: isZh ? tr.featLocalDesc : tr.featLocalDescEn, color: '#475569' },
  ];
  document.getElementById('features').innerHTML = features.map(f =>
    '<div class="feature-item">' +
    '<div class="feat-icon" style="color:' + (dark ? f.color + 'cc' : f.color) + '">' + svg(f.icon, 20) + '</div>' +
    '<div class="feat-label">' + f.label + '</div>' +
    '<div class="feat-desc">' + f.desc + '</div>' +
    '</div>'
  ).join('');

  // Section headers
  document.getElementById('section-doc-title').textContent = isZh ? tr.sectionDoc : tr.sectionDocEn;
  document.getElementById('section-doc-sub').textContent = isZh ? tr.sectionDocEn : tr.sectionDoc;
  document.getElementById('section-doc-count').textContent = isZh ? tr.docCount : tr.docCountEn;

  document.getElementById('section-util-title').textContent = isZh ? tr.sectionUtil : tr.sectionUtilEn;
  document.getElementById('section-util-sub').textContent = isZh ? tr.sectionUtilEn : tr.sectionUtil;
  document.getElementById('section-util-count').textContent = isZh ? tr.toolCount : tr.toolCountEn;

  document.getElementById('section-cert-title').textContent = isZh ? tr.sectionCert : tr.sectionCertEn;
  document.getElementById('section-cert-sub').textContent = isZh ? tr.sectionCertEn : tr.sectionCert;
  document.getElementById('section-cert-count').textContent = isZh ? tr.certCount : tr.certCountEn;

  // Doc cards - sections with SPA jump card appended
  var sections = [
    { grid: 'doc-grid-1', cards: DOC_CARDS.slice(0, 7) },
    { grid: 'doc-grid-2', cards: DOC_CARDS.slice(7, 11) },
    { grid: 'doc-grid-3', cards: DOC_CARDS.slice(11) },
  ];

  sections.forEach(function(sec) {
    var grid = document.getElementById(sec.grid);
    var html = sec.cards.map(function(card) {
      var meta = DOC_META[card.type];
      var icon = DOC_ICONS[card.type];
      var gradient = DOC_GRADIENTS[card.type];
      var badge = DOC_BADGES[card.type];
      var isUtil = UTILITY_TOOLS.has(card.type);
      var btnText = isZh ? (isUtil && card.type !== 'certificate_of_origin' ? tr.startUtil : tr.startCreate) : (isUtil && card.type !== 'certificate_of_origin' ? tr.startUtilEn : tr.startCreateEn);
      var titleText = isZh ? card.subtitle : card.title;
      var subtitleText = isZh ? card.title : card.subtitle;
      var descText = isZh ? card.desc : card.descEn;
      var features = isZh ? card.features : card.featuresEn;
      return '<div class="doc-card">' +
        '<div class="doc-card-gradient" style="background:linear-gradient(to right, ' + gradient + ')"></div>' +
        '<div class="doc-card-header">' +
          '<div class="doc-card-icon" style="color:' + badge + '">' + svg(icon, 32) + '</div>' +
          '<div class="doc-card-features">' +
            features.map(function(f) {
              return '<span class="doc-card-feature-tag" style="background:' + badge + '22; color:' + badge + '">' + f + '</span>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="doc-card-title">' + titleText + '</div>' +
        '<div class="doc-card-subtitle">' + subtitleText + '</div>' +
        '<div class="doc-card-desc">' + descText + '</div>' +
        '<div class="doc-card-actions"><a href="' + meta.page + '" class="doc-card-btn" style="background:linear-gradient(to right, ' + gradient + ')">' + btnText + '</a></div>' +
      '</div>';
    }).join('');

    grid.innerHTML = html;
  });

  // FAQ Section on home page
  injectHomeFaq();

  // Footer
  document.getElementById('footer-note').textContent = isZh ? tr.footerNote : tr.footerNoteEn;
}

// Toggle handlers
document.getElementById('lang-btn').addEventListener('click', function() {
  var next = getLang() === 'zh' ? 'en' : 'zh';
  setLang(next);
  render();
});

document.getElementById('theme-btn').addEventListener('click', function() {
  setTheme(!isDark());
  applyTheme();
  render();
});

// Inject FAQ section on home page
function injectHomeFaq() {
  var el = document.getElementById('home-faq');
  if (!el) return;
  // Prevent duplicate injection on re-render
  if (el.getAttribute('data-injected') === '1') {
    // Update text content for language switch
    var lang = getLang();
    var isZh = lang === 'zh';
    var faqs = FAQ_GENERAL;
    var items = faqs[lang] || faqs.zh;
    var questions = el.querySelectorAll('.faq-question span');
    var answers = el.querySelectorAll('.faq-answer p');
    items.forEach(function(faq, i) {
      if (questions[i]) questions[i].textContent = faq.q;
      if (answers[i]) answers[i].textContent = faq.a;
    });
    return;
  }
  el.setAttribute('data-injected', '1');

  var lang = getLang();
  var isZh = lang === 'zh';
  var faqs = FAQ_GENERAL;
  var items = faqs[lang] || faqs.zh;
  var html = '<div class="faq-header"><h2>' + (isZh ? '常见问题' : 'FAQ') + '</h2></div>';
  items.forEach(function(faq, i) {
    html += '<div class="faq-item" onclick="this.classList.toggle(\'open\')">' +
      '<div class="faq-question"><span>' + faq.q + '</span><span class="faq-arrow"></span></div>' +
      '<div class="faq-answer"><p>' + faq.a + '</p></div>' +
    '</div>';
  });
  el.innerHTML = html;

  // Inject FAQPage JSON-LD
  if (!document.getElementById('faq-jsonld')) {
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'faq-jsonld';
    var langData = faqs[lang] || faqs.zh;
    var jsonLd = {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": langData.map(function(faq) {
        return {
          "@type": "Question",
          "name": faq.q,
          "acceptedAnswer": { "@type": "Answer", "text": faq.a }
        };
      })
    };
    script.textContent = JSON.stringify(jsonLd);
    document.head.appendChild(script);
  }
}

// Initial render
render();
</script>
