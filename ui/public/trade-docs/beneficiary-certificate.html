<script>
var DT='beneficiary_certificate',DT_META=DOC_META[DT],lang=getLang(),dark=isDark(),previewLang='en',data=null,showClearConfirm=false;
function init(){applyTheme();var s=loadDocData(DT);data=s?s:getDefaultDoc(DT);renderAll();}
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
function renderAll(){renderTopBar();renderHeader();renderTabs();renderForm();renderPreview();renderHistory();renderClearModal();}
function renderTopBar(){var tr=I18N[lang];document.documentElement.lang=lang;document.getElementById('back-icon').innerHTML=svg('ArrowLeft',16);document.getElementById('back-text').textContent=tr.backHome;document.getElementById('lang-icon').innerHTML=svg('Languages',16);document.getElementById('lang-label').textContent=lang==='zh'?'EN':'中文';document.getElementById('theme-icon').innerHTML=svg(dark?'Sun':'Moon',16);document.getElementById('theme-label').textContent=dark?'Light':'Dark';}
function renderHeader(){document.getElementById('page-title').textContent=DT_META.title;document.getElementById('page-subtitle').textContent=DT_META.titleZh;}
function renderTabs(){var tr=I18N[lang];document.getElementById('tab-edit').textContent=tr.formEditor;document.getElementById('tab-preview').textContent=tr.previewTab;document.getElementById('tab-history').textContent=tr.historyTab;var ps=['edit','preview','history'];ps.forEach(function(p){document.getElementById('tab-'+p).onclick=function(){ps.forEach(function(pp){document.getElementById('tab-'+pp).classList.toggle('active',pp===p);document.getElementById('panel-'+pp).classList.toggle('active',pp===p);});};});}
function switchTab(t){['edit','preview','history'].forEach(function(p){document.getElementById('tab-'+p).classList.toggle('active',p===t);document.getElementById('panel-'+p).classList.toggle('active',p===t);});}
function renderForm(){
  var tr=I18N[lang],isZh=lang==='zh',d=data;
  document.getElementById('btn-load-sample').textContent=tr.loadSample;document.getElementById('btn-clear').textContent=tr.clear;
  document.getElementById('btn-switch-preview').textContent=tr.preview;document.getElementById('btn-pdf').textContent=tr.exportPdf;
  document.getElementById('btn-back-edit').textContent=tr.backEdit;document.getElementById('btn-preview-lang').textContent=previewLang==='en'?'Switch to 中文':'Switch to English';
  document.getElementById('btn-pdf-preview').textContent=tr.exportPdf;document.getElementById('btn-print').textContent=tr.print;
  document.getElementById('history-search').placeholder=tr.searchPlaceholder;
  document.getElementById('btn-load-sample').onclick=loadSample;document.getElementById('btn-clear').onclick=function(){showClearConfirm=true;renderClearModal();};
  document.getElementById('btn-switch-preview').onclick=function(){switchTab('preview');renderPreview();};document.getElementById('btn-back-edit').onclick=function(){switchTab('edit');};
  document.getElementById('btn-pdf').onclick=function(){doExportPdf(DT,data,'preview-content');};document.getElementById('btn-pdf-preview').onclick=function(){doExportPdf(DT,data,'preview-content');};
  document.getElementById('btn-preview-lang').onclick=function(){previewLang=previewLang==='en'?'zh':'en';renderPreview();};document.getElementById('btn-print').onclick=function(){window.print();};
  var h='';
  h+='<div class="section-card"><h3>'+fB(isZh?'受益人':'Beneficiary','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'名称':'Name',d.beneficiaryName,'beneficiaryName','');h+=lI(isZh?'地址':'Address',d.beneficiaryAddress,'beneficiaryAddress','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'收货人':'Consignee','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'名称':'Name',d.consigneeName,'consigneeName','');h+=lI(isZh?'地址':'Address',d.consigneeAddress,'consigneeAddress','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'信用证信息':'L/C Details','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'信用证号':'L/C No.',d.lcNo,'lcNo','');h+=lI(isZh?'发票号':'Invoice No.',d.invoiceNo,'invoiceNo','');
  h+=lI(isZh?'合同号':'Contract No.',d.contractNo,'contractNo','');h+=lID(isZh?'签发日期':'Date of Issue',d.dateOfIssue,'dateOfIssue');
  h+=lI(isZh?'开证行':'Issuing Bank',d.issuingBank,'issuingBank','');h+=lI(isZh?'证书类型':'Certificate Type',d.certificateType,'certificateType','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'运输与商品':'Transport & Goods','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'船名':'Vessel',d.vessel,'vessel','');h+=lI(isZh?'装货港':'Port of Loading',d.portOfLoading,'portOfLoading','');
  h+=lI(isZh?'卸货港':'Port of Discharge',d.portOfDischarge,'portOfDischarge','');h+=lI(isZh?'原产国':'Country of Origin',d.countryOfOrigin,'countryOfOrigin','');
  h+=lI(isZh?'目的地国家':'Destination Country',d.destinationCountry,'destinationCountry','');h+=lID(isZh?'装运日期':'Shipment Date',d.shipmentDate,'shipmentDate');
  h+=lI(isZh?'货物描述':'Goods Description',d.goodsDescription,'goodsDescription','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'声明与签署':'Declaration & Signature','')+'</h3>';
  h+='<div><div class="form-label">'+(isZh?'声明内容':'Declaration')+'</div><textarea class="input-field" rows="2" onchange="window._bcSet(\'declaration\',this.value)">'+esc(d.declaration)+'</textarea></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  h+=lI(isZh?'受益人签名':'Beneficiary Signature',d.beneficiarySignature,'beneficiarySignature','');
  h+=lID(isZh?'签名日期':'Signature Date',d.signatureDate,'signatureDate');h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="header-title">'+tr2('BENEFICIARY CERTIFICATE','受益人证明')+'</div>';
  h+='<table><tbody><tr><td style="width:50%;"><div class="section-label2">'+tr2('BENEFICIARY','受益人')+'</div>';
  h+='<div class="section-value">'+esc(d.beneficiaryName||'—')+'</div><div class="section-value">'+esc(d.beneficiaryAddress||'—')+'</div></td>';
  h+='<td style="width:50%;"><div class="section-label2">'+tr2('CONSIGNEE','收货人')+'</div>';
  h+='<div class="section-value">'+esc(d.consigneeName||'—')+'</div><div class="section-value">'+esc(d.consigneeAddress||'—')+'</div></td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('L/C NO.','信用证号'),tr2('INVOICE NO.','发票号'),tr2('CONTRACT NO.','合同号'),tr2('DATE OF ISSUE','签发日期'),tr2('ISSUING BANK','开证行'),tr2('CERTIFICATE TYPE','证明类型')].forEach(function(t){h+='<th style="width:16%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.lcNo,d.invoiceNo,d.contractNo,d.dateOfIssue,d.issuingBank,d.certificateType].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('VESSEL','船名'),tr2('PORT OF LOADING','装货港'),tr2('PORT OF DISCHARGE','卸货港'),tr2('COUNTRY OF ORIGIN','原产国'),tr2('DESTINATION','目的地'),tr2('SHIPMENT DATE','装运日期'),tr2('GOODS','货物')].forEach(function(t){h+='<th style="width:14%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.vessel,d.portOfLoading,d.portOfDischarge,d.countryOfOrigin,d.destinationCountry,d.shipmentDate,d.goodsDescription].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<div class="mt-2"><div class="section-label2">'+tr2('DECLARATION','声明')+'</div><div class="section-value">'+esc(d.declaration)+'</div></div>';
  h+='<div class="mt-2"><table><tbody><tr><td style="width:50%;"><div class="section-label2">'+tr2('BENEFICIARY SIGNATURE','受益人签名')+'</div>';
  h+='<div class="section-value">'+esc(d.beneficiarySignature||'—')+'</div><div style="margin-top:48px;border-top:1px solid #000;width:192px;"></div></td>';
  h+='<td style="width:50%;"><div class="section-label2">'+tr2('SIGNATURE DATE','签名日期')+'</div>';
  h+='<div class="section-value">'+esc(d.signatureDate||'—')+'</div><div style="margin-top:48px;border-top:1px solid #000;width:192px;"></div></td></tr></tbody></table></div></div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._bcRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._bcDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._bcClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._bcSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._bcRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._bcDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._bcClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._bcSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._bcSet(\''+f+'\',this.value)"></div>';}
function loadSample(){var s=getDefaultDoc(DT);s.beneficiaryName='Shanghai Export Co., Ltd.';s.beneficiaryAddress='No.123 Zhangjiang Rd, Pudong, Shanghai, China';
s.consigneeName='ABC Trading LLC';s.consigneeAddress='456 Fifth Ave, New York, NY 10001, USA';
s.lcNo='LC-2026-001';s.invoiceNo='INV-2026-001';s.contractNo='SC-2026-001';s.dateOfIssue='2026-05-10';
s.issuingBank='Bank of China, Shanghai Branch';s.certificateType='Quality Certificate';
s.vessel='COSCO SHANGHAI';s.portOfLoading='Shanghai';s.portOfDischarge='New York';s.countryOfOrigin='China';s.destinationCountry='USA';
s.shipmentDate='2026-05-15';s.goodsDescription='Stainless Steel Water Bottles';
s.declaration='We hereby certify that the goods described above are of Chinese origin and conform to the specifications stated in the contract.';
s.beneficiarySignature='Zhang Wei, Authorized Signatory';s.signatureDate='2026-05-10';
data=s;saveDocData(DT,data);renderAll();}
init();
</script>
