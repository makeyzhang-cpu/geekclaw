var DT='commercial_quotation',DT_META=DOC_META[DT],lang=getLang(),dark=isDark(),previewLang='en',data=null,showClearConfirm=false;
function init(){applyTheme();var s=loadDocData(DT);data=s?s:getDefaultDoc(DT);renderAll();}

function renderAll(){renderTopBar();renderHeader();renderTabs();renderForm();renderPreview();renderHistory();renderClearModal();}
function renderTopBar(){var tr=I18N[lang];document.documentElement.lang=lang;document.getElementById('back-icon').innerHTML=svg('ArrowLeft',16);document.getElementById('back-text').textContent=tr.backHome;document.getElementById('lang-icon').innerHTML=svg('Languages',16);document.getElementById('lang-label').textContent=lang==='zh'?'EN':'中文';document.getElementById('theme-icon').innerHTML=svg(dark?'Sun':'Moon',16);document.getElementById('theme-label').textContent=dark?'Light':'Dark';}
function renderHeader(){document.getElementById('page-title').textContent=DT_META.title;document.getElementById('page-subtitle').textContent=DT_META.titleZh;}
function renderTabs(){var tr=I18N[lang];document.getElementById('tab-edit').textContent=tr.formEditor;document.getElementById('tab-preview').textContent=tr.previewTab;document.getElementById('tab-history').textContent=tr.historyTab;var ps=['edit','preview','history'];ps.forEach(function(p){document.getElementById('tab-'+p).onclick=function(){ps.forEach(function(pp){document.getElementById('tab-'+pp).classList.toggle('active',pp===p);document.getElementById('panel-'+pp).classList.toggle('active',pp===p);});};});}
function switchTab(t){['edit','preview','history'].forEach(function(p){document.getElementById('tab-'+p).classList.toggle('active',p===t);document.getElementById('panel-'+p).classList.toggle('active',p===t);});}
function renderForm(){
  var tr=I18N[lang],isZh=lang==='zh',d=data;

  document.getElementById('btn-preview-lang').onclick=function(){previewLang=previewLang==='en'?'zh':'en';renderPreview();};document.getElementById('btn-print').onclick=function(){window.print();};

  h+='<div style="display:flex;align-items:center;gap:16px;">';

  h+=lI(isZh?'付款条款':'Payment Terms',d.paymentTerms,'paymentTerms','');h+=lI(isZh?'交货条款':'Delivery Terms',d.deliveryTerms,'deliveryTerms','');
  h+=lI(isZh?'交货周期':'Lead Time',d.leadTime,'leadTime','');h+=lI(isZh?'最小起订量':'Min Order Qty',d.minOrderQty,'minOrderQty','');h+='</div></div>';
  // Seller/Buyer
  h+='<div class="section-card"><h3>'+fB(isZh?'卖方信息':'Seller Info','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'姓名':'Name',d.sellerName,'sellerName','');h+=lI(isZh?'公司':'Company',d.sellerCompany,'sellerCompany','');
  h+=lI(isZh?'地址':'Address',d.sellerAddress,'sellerAddress','');h+=lI(isZh?'电话':'Phone',d.sellerPhone,'sellerPhone','');
  h+=lI(isZh?'邮箱':'Email',d.sellerEmail,'sellerEmail','');h+=lI(isZh?'税号':'Tax ID',d.sellerTaxId,'sellerTaxId','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'买方信息':'Buyer Info','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'姓名':'Name',d.buyerName,'buyerName','');h+=lI(isZh?'公司':'Company',d.buyerCompany,'buyerCompany','');
  h+=lI(isZh?'地址':'Address',d.buyerAddress,'buyerAddress','');h+=lI(isZh?'电话':'Phone',d.buyerPhone,'buyerPhone','');
  h+=lI(isZh?'邮箱':'Email',d.buyerEmail,'buyerEmail','');h+=lI(isZh?'税号':'Tax ID',d.buyerTaxId,'buyerTaxId','');h+='</div></div>';
  // Items
  h+='<div class="section-card"><h3>'+fB(isZh?'报价明细':'Quotation Items','')+'</h3>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  h+='<p style="font-size:13px;color:var(--text-muted);">'+(isZh?'逐项添加报价项目。':'Add items.')+'</p>';

  h+='<div class="items-table-container"><table class="items-table"><thead><tr>';
  ['#',isZh?'编号':'No.',isZh?'描述':'DESCRIPTION',isZh?'规格':'Specification',
   isZh?'数量':'QTY',isZh?'单位':'UNIT',isZh?'单价':'Unit Price',isZh?'折扣':'Discount',isZh?'行合计':'Line Total',
   isZh?'操作':'Action'].forEach(function(th){h+='<th>'+th+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="row-number">'+(idx+1)+'</td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.itemNo)+'" onchange="window._cqItem('+idx+',\'itemNo\',this.value)"></td>';
    h+='<td class="description-cell"><textarea class="input-field input-field-sm" rows="2" onchange="window._cqItem('+idx+',\'description\',this.value)">'+esc(it.description)+'</textarea></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.specification)+'" onchange="window._cqItem('+idx+',\'specification\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" type="number" min="0" value="'+esc(it.quantity)+'" onchange="window._cqItem('+idx+',\'quantity\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.unitOfMeasure)+'" onchange="window._cqItem('+idx+',\'unitOfMeasure\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc(it.unitPrice)+'" onchange="window._cqItem('+idx+',\'unitPrice\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc(it.discount)+'" onchange="window._cqItem('+idx+',\'discount\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc(it.lineTotal)+'" readonly style="background:var(--bg);"></td>';
    h+='<td class="actions"><button class="btn btn-danger" onclick="window._cqRemoveItem('+idx+')" '+(d.items.length<=1?'disabled':'')+'>&times;</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'小计':'Subtotal')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.subtotal||'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总折扣':'Total Discount')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalDiscount||'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'税费':'Tax')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalTax||'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总计':'Grand Total')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.grandTotal||'—')+'</span></div>';
  h+='</div></div></div>';
  // Terms & Signature
  h+='<div class="section-card"><h3>'+fB(isZh?'条款与签名':'Terms & Signature','')+'</h3>';
  h+='<div><div class="form-label">'+(isZh?'条款条件':'Terms & Conditions')+'</div><textarea class="input-field" rows="2" onchange="window._cqSet(\'termsAndConditions\',this.value)">'+esc(d.termsAndConditions)+'</textarea></div>';
  h+='<div style="margin-top:8px;"><div class="form-label">'+(isZh?'备注':'Remarks')+'</div><textarea class="input-field" rows="2" onchange="window._cqSet(\'remarks\',this.value)">'+esc(d.remarks)+'</textarea></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  h+=lI(isZh?'签名人':'Signatory',d.signatureName,'signatureName','');h+=lI(isZh?'职务':'Title',d.signatureTitle,'signatureTitle','');
  h+=lID(isZh?'日期':'Date',d.signatureDate,'signatureDate');h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  if(d.logo)h+='<div style="text-align:center;margin-bottom:16px;"><img src="'+esc(d.logo)+'" style="max-height:50px;"></div>';
  h+='<div class="header-title">'+tr2('COMMERCIAL QUOTATION','商业报价单')+'</div>';
  h+='<table><tbody><tr><th style="width:25%;">'+tr2('QUOTATION NO.','报价单号')+'</th><th style="width:25%;">'+tr2('DATE','日期')+'</th><th style="width:25%;">'+tr2('VALIDITY','有效期')+'</th><th style="width:25%;">'+tr2('CURRENCY','货币')+'</th></tr>';
  h+='<tr><td class="text-center">'+esc(d.quotationNo||'—')+'</td><td class="text-center">'+esc(d.quotationDate||'—')+'</td><td class="text-center">'+esc(d.validityPeriod||'—')+'</td><td class="text-center">'+esc(d.currency||'—')+'</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr><td style="width:50%;"><div class="section-label2">'+tr2('SELLER','卖方')+'</div>';
  h+='<div class="section-value">'+esc(d.sellerName||'—')+'</div>';
  if(d.sellerCompany)h+='<div class="section-value">'+esc(d.sellerCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.sellerAddress||'—')+'</div>';
  h+='</td><td style="width:50%;"><div class="section-label2">'+tr2('BUYER','买方')+'</div>';
  h+='<div class="section-value">'+esc(d.buyerName||'—')+'</div>';
  if(d.buyerCompany)h+='<div class="section-value">'+esc(d.buyerCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.buyerAddress||'—')+'</div>';
  h+='</td></tr></tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('ITEM NO.','编号'),tr2('DESCRIPTION','描述'),tr2('SPEC','规格'),tr2('QTY','数量'),tr2('UNIT','单位'),tr2('UNIT PRICE','单价'),tr2('DISCOUNT','折扣'),tr2('LINE TOTAL','行合计')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td class="text-center">'+esc(it.itemNo||'—')+'</td><td>'+esc(it.description||'—')+'</td><td>'+esc(it.specification||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.quantity||'—')+'</td><td class="text-center">'+esc(it.unitOfMeasure||'—')+'</td>';
    h+='<td class="text-right">'+esc(it.unitPrice||'—')+'</td><td class="text-right">'+esc(it.discount||'—')+'</td><td class="text-right">'+esc(it.lineTotal||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<table class="mt-2"><tbody>';
  h+='<tr><td style="width:75%;"></td><td class="text-right font-bold">'+tr2('SUBTOTAL','小计')+':</td><td class="text-right">'+esc(d.subtotal||'—')+'</td></tr>';
  h+='<tr><td></td><td class="text-right font-bold">'+tr2('TOTAL DISCOUNT','总折扣')+':</td><td class="text-right">'+esc(d.totalDiscount||'—')+'</td></tr>';
  h+='<tr><td></td><td class="text-right font-bold">'+tr2('TAX','税费')+':</td><td class="text-right">'+esc(d.totalTax||'—')+'</td></tr>';
  h+='<tr class="bg-gray-100"><td></td><td class="text-right font-bold">'+tr2('GRAND TOTAL','总计')+':</td><td class="text-right font-bold">'+esc(d.grandTotal||'—')+'</td></tr>';
  h+='</tbody></table>';
  if(d.termsAndConditions)h+='<div class="mt-2"><div class="section-label2">'+tr2('TERMS & CONDITIONS','条款条件')+'</div><div class="section-value">'+esc(d.termsAndConditions)+'</div></div>';
  if(d.remarks)h+='<div class="mt-2"><div class="section-label2">'+tr2('REMARKS','备注')+'</div><div class="section-value">'+esc(d.remarks)+'</div></div>';
  h+='<div class="mt-2" style="text-align:right;"><div class="section-label2">'+tr2('SIGNATURE','签名')+'</div>';
  h+='<div class="section-value">'+esc(d.signatureName||'—')+'</div><div class="section-value">'+esc(d.signatureTitle||'')+'</div>';
  h+='<div class="section-value">'+esc(d.signatureDate||'')+'</div></div></div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._cqRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._cqDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._cqClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._cqSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._cqItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);saveDocData(DT,data);};
window._cqAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._cqRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._cqRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._cqDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._cqClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
window._cqLogoUpload=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){data.logo=ev.target.result;saveDocData(DT,data);renderForm();};r.readAsDataURL(f);};
window._cqRemoveLogo=function(){data.logo='';saveDocData(DT,data);renderForm();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._cqSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._cqSet(\''+f+'\',this.value)"></div>';}
