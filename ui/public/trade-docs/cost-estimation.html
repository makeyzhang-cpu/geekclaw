  h+=labelInput(isZh?'客户地址':'Client Address',d.clientAddress,'clientAddress','');
  h+=labelInput(isZh?'产品名称':'Product Name',d.productName,'productName','');
  h+=labelInput(isZh?'产品规格':'Product Spec',d.productSpec,'productSpec','');
  h+=labelSelect2(isZh?'币种':'Currency',d.currency,'currency',CURRENCIES.map(function(c){return[c,c+' - '+CURRENCY_NAMES[c]];}));
  h+=labelInputDate2(isZh?'有效期至':'Validity Period',d.validityPeriod,'validityPeriod');
  h+='</div></div>';
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'成本明细':'Cost Items','')+'</h3>';

  h+='<p style="font-size:13px;color:var(--text-muted);">'+(isZh?'逐项添加成本项目，总成本 = 数量 × 单位成本。':'Add items. Total = quantity × unit cost.')+'</p>';

  ['#','ITEM NAME'+(isZh?'<span class="col-label-cn">项目名称</span>':''),
   'SPEC'+(isZh?'<span class="col-label-cn">规格</span>':''),

   'UNIT COST'+(isZh?'<span class="col-label-cn">单位成本</span>':''),
   'TOTAL'+(isZh?'<span class="col-label-cn">总价</span>':''),
   'NOTES'+(isZh?'<span class="col-label-cn">备注</span>':''),
   isZh?'操作':'Action'].forEach(function(th){h+='<th>'+th+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="row-number">'+(idx+1)+'</td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc2(it.itemName)+'" onchange="window._ceItem('+idx+',\'itemName\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc2(it.specification)+'" onchange="window._ceItem('+idx+',\'specification\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" type="number" min="0" value="'+esc2(it.quantity)+'" onchange="window._ceItem('+idx+',\'quantity\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc2(it.unitCost)+'" onchange="window._ceItem('+idx+',\'unitCost\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right font-medium" type="number" min="0" step="0.01" value="'+esc2(it.totalCost)+'" onchange="window._ceItem('+idx+',\'totalCost\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc2(it.notes)+'" onchange="window._ceItem('+idx+',\'notes\',this.value)"></td>';
    h+='<td class="actions"><button class="btn btn-danger" onclick="window._ceRemoveItem('+idx+')" '+(d.items.length<=1?'disabled':'')+'>&times;</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'成本小计':'Subtotal Cost')+' ('+d.currency+')</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(sub>0?sub.toFixed(2):'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'利润':'Profit')+' ('+pm+'%)</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+profit.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'税金':'Tax')+' ('+tr_+'%)</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+tax.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'折扣':'Discount')+' ('+dr+'%)</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+discount.toFixed(2)+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总计':'Grand Total')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+grand.toFixed(2)+'</span></div>';
  h+='</div></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));margin-top:16px;">';
  h+=labelInput(isZh?'利润率(%)':'Profit Margin (%)',d.profitMargin,'profitMargin','10');
  h+=labelInput(isZh?'税率(%)':'Tax Rate (%)',d.taxRate,'taxRate','13');
  h+=labelInput(isZh?'折扣率(%)':'Discount Rate (%)',d.discountRate,'discountRate','0');
  h+='</div></div>';
  h+='<div class="section-card"><h3>'+fieldBlock(isZh?'条款与签名':'Terms & Signature','')+'</h3>';
  h+='<div class="form-label">'+(isZh?'条款':'Terms & Conditions')+'</div>';
  h+='<textarea class="input-field" rows="2" onchange="window._ceSet(\'termsAndConditions\',this.value)">'+esc2(d.termsAndConditions)+'</textarea>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  h+=labelInput(isZh?'签名姓名':'Signature Name',d.signatureName,'signatureName','');
  h+=labelInput(isZh?'职务':'Title',d.signatureTitle,'signatureTitle','');
  h+=labelInputDate2(isZh?'日期':'Date',d.signatureDate,'signatureDate');
  h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh',sub=d.items.reduce(function(s,it){return s+(parseFloat(it.totalCost)||0);},0);
  var pm=parseFloat(d.profitMargin)||0,tr_=parseFloat(d.taxRate)||0,dr=parseFloat(d.discountRate)||0;
  var profit=(sub*pm/100),tax=(sub+profit)*tr_/100,discount=(sub+profit+tax)*dr/100,grand=sub+profit+tax-discount;
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="header-title">'+tr2('COST ESTIMATION','成本估算单')+'</div>';
  h+='<table><tbody>';
  h+='<tr><td style="width:50%;"><div class="section-label2">'+tr2('PROJECT','项目信息')+'</div>';
  h+='<div class="section-value">'+tr2('Ref','参考')+': '+esc(d.projectRef||'—')+'</div>';
  h+='<div class="section-value">'+tr2('Date','日期')+': '+esc(d.preparationDate||'—')+'</div>';
  h+='<div class="section-value">'+tr2('Prepared By','编制人')+': '+esc(d.preparedBy||'—')+'</div></td>';
  h+='<td style="width:50%;"><div class="section-label2">'+tr2('CLIENT','客户信息')+'</div>';
  h+='<div class="section-value">'+esc(d.clientName||'—')+'</div>';
  if(d.clientCompany)h+='<div class="section-value">'+esc(d.clientCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.clientAddress||'—')+'</div></td></tr>';
  h+='<tr><td colspan="2"><div class="section-label2">'+tr2('PRODUCT','产品信息')+'</div>';
  h+='<div class="section-value">'+esc(d.productName||'—')+' — '+esc(d.productSpec||'—')+'</div></td></tr>';
  h+='</tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('ITEM','项目'),tr2('SPEC','规格'),tr2('QTY','数量'),tr2('UNIT COST','单位成本'),tr2('TOTAL','总价'),tr2('NOTES','备注')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td>'+esc(it.itemName||'—')+'</td><td>'+esc(it.specification||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.quantity||'—')+'</td><td class="text-right">'+(it.unitCost?parseFloat(it.unitCost).toFixed(2):'—')+'</td>';
    h+='<td class="text-right font-medium">'+(it.totalCost?parseFloat(it.totalCost).toFixed(2):'—')+'</td><td>'+esc(it.notes||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<table class="mt-2"><tbody>';
  h+='<tr><th style="width:25%;">'+tr2('SUBTOTAL','成本小计')+'</th><td class="text-right">'+sub.toFixed(2)+' '+d.currency+'</td></tr>';
  h+='<tr><th>'+tr2('PROFIT','利润')+' ('+pm+'%)</th><td class="text-right">'+profit.toFixed(2)+'</td></tr>';
  h+='<tr><th>'+tr2('TAX','税金')+' ('+tr_+'%)</th><td class="text-right">'+tax.toFixed(2)+'</td></tr>';
  h+='<tr><th>'+tr2('DISCOUNT','折扣')+' ('+dr+'%)</th><td class="text-right">-'+discount.toFixed(2)+'</td></tr>';
  h+='<tr style="background:#f0f0f0;"><th class="font-bold">'+tr2('GRAND TOTAL','总计')+'</th><td class="text-right font-bold" style="font-size:14px;">'+grand.toFixed(2)+' '+d.currency+'</td></tr>';
  h+='</tbody></table>';
  if(d.termsAndConditions){h+='<div style="margin-top:12px;"><div class="section-label2">'+tr2('TERMS & CONDITIONS','条款')+'</div><div class="section-value whitespace-pre-wrap">'+esc(d.termsAndConditions)+'</div></div>';}
  h+='<div style="margin-top:20px;border-top:1px solid #9ca3af;padding-top:12px;"><table><tbody><tr>';
  h+='<td style="width:33%;"><div class="section-label">'+tr2('SIGNATURE','签名')+'</div><div style="margin-top:24px;border-bottom:1px solid #000;width:192px;"></div>';
  h+='<div class="text-xs mt-1">'+esc(d.signatureName||'—')+' / '+esc(d.signatureTitle||'—')+' / '+esc(d.signatureDate||'—')+'</div></td></tr></tbody></table></div>';
  h+='</div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._ceRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._ceDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._ceClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._ceSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._ceItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);saveDocData(DT,data);renderForm();};
window._ceAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._ceRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._ceRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._ceDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._ceClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};

function fieldBlock(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');};
