  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+='<div><div class="form-label">'+(isZh?'保险条款':'Insurance Terms')+'</div><input class="input-field" value="'+esc(d.insuranceTerms)+'" onchange="window._tcSet(\'insuranceTerms\',this.value)"></div>';

  h+='</div>';
  h+='<div style="margin-top:12px;"><div class="form-label">'+(isZh?'不可抗力':'Force Majeure')+'</div><textarea class="input-field" rows="2" onchange="window._tcSet(\'forceMajeure\',this.value)">'+esc(d.forceMajeure)+'</textarea></div>';

    h+='<td class="description-cell"><textarea class="input-field input-field-sm" rows="2" onchange="window._tcItem('+idx+',\'description\',this.value)">'+esc(it.description)+'</textarea></td>';

    h+='<td><input class="input-field input-field-xs text-center" type="number" min="0" value="'+esc(it.qty)+'" onchange="window._tcItem('+idx+',\'qty\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.unitOfMeasure)+'" onchange="window._tcItem('+idx+',\'unitOfMeasure\',this.value)"></td>';

  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总金额':'Total Amount')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalAmount||'—')+'</span></div>';
  h+='</div></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:16px;">';

  h+='<div><h4 style="font-size:14px;margin-bottom:8px;color:var(--text-secondary);">'+(isZh?'卖方签署':'Seller Signature')+'</h4>';
  h+=lI(isZh?'签名人':'Signatory',d.sellerSignatureName,'sellerSignatureName','');h+=lI(isZh?'职务':'Title',d.sellerSignatureTitle,'sellerSignatureTitle','');
  h+=lID(isZh?'日期':'Date',d.sellerSignatureDate,'sellerSignatureDate');h+='</div>';

  h+=lID(isZh?'日期':'Date',d.buyerSignatureDate,'buyerSignatureDate');h+='</div>';
  h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;

function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="header-title">'+tr2('TRADE CONTRACT','外贸合同')+'</div>';
  h+='<table><tbody><tr><th style="width:25%;">'+tr2('CONTRACT NO.','合同号')+'</th><th style="width:25%;">'+tr2('DATE OF SIGNING','签署日期')+'</th><th style="width:25%;">'+tr2('PLACE OF SIGNING','签署地')+'</th><th style="width:25%;">'+tr2('CURRENCY','货币')+'</th></tr>';
  h+='<tr><td class="text-center">'+esc(d.contractNo||'—')+'</td><td class="text-center">'+esc(d.dateOfSigning||'—')+'</td><td class="text-center">'+esc(d.placeOfSigning||'—')+'</td><td class="text-center">'+esc(d.currency||'—')+'</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr><td style="width:50%;"><div class="section-label2">'+tr2('SELLER','卖方')+'</div>';
  h+='<div class="section-value">'+esc(d.sellerName||'—')+'</div>';
  if(d.sellerCompany)h+='<div class="section-value">'+esc(d.sellerCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.sellerAddress||'—')+'</div>';
  if(d.sellerPhone)h+='<div class="section-value">Tel: '+esc(d.sellerPhone)+'</div>';
  h+='</td><td style="width:50%;"><div class="section-label2">'+tr2('BUYER','买方')+'</div>';
  h+='<div class="section-value">'+esc(d.buyerName||'—')+'</div>';
  if(d.buyerCompany)h+='<div class="section-value">'+esc(d.buyerCompany)+'</div>';
  h+='<div class="section-value">'+esc(d.buyerAddress||'—')+'</div>';
  if(d.buyerPhone)h+='<div class="section-value">Tel: '+esc(d.buyerPhone)+'</div>';
  h+='</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('PAYMENT TERMS','付款条款'),tr2('DELIVERY TERMS','交货条款'),tr2('SHIPMENT DATE','装船日期'),tr2('PORT OF LOADING','装货港'),tr2('PORT OF DISCHARGE','卸货港')].forEach(function(t){h+='<th style="width:20%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.paymentTerms,d.deliveryTerms,d.shipmentDate,d.portOfLoading,d.portOfDischarge].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('ITEM NO.','项号'),tr2('DESCRIPTION','描述'),tr2('SPECIFICATION','规格'),tr2('QTY','数量'),tr2('UNIT','单位'),tr2('UNIT PRICE','单价'),tr2('TOTAL AMOUNT','金额')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td class="text-center">'+esc(it.itemNo||'—')+'</td><td>'+esc(it.description||'—')+'</td><td>'+esc(it.specification||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.qty||'—')+'</td><td class="text-center">'+esc(it.unitOfMeasure||'—')+'</td>';
    h+='<td class="text-right">'+esc(it.unitPrice||'—')+'</td><td class="text-right">'+esc(it.totalAmount||'—')+'</td></tr>';
  });
  h+='<tr class="bg-gray-100"><td colspan="7" class="text-right font-bold">'+tr2('TOTAL AMOUNT','总金额')+':</td><td class="text-right font-bold">'+esc(d.totalAmount||'—')+'</td></tr>';
  h+='</tbody></table>';

    h+='<div class="mt-2"><div class="section-label2">'+tr2('TERMS','条款')+'</div>';

  h+='<div style="text-align:left;"><div class="section-label2">'+tr2('SELLER','卖方')+'</div>';
  h+='<div class="section-value">'+esc(d.sellerSignatureName||'—')+'</div><div class="section-value">'+esc(d.sellerSignatureTitle||'')+'</div><div class="section-value">'+esc(d.sellerSignatureDate||'')+'</div></div>';
  h+='<div style="text-align:right;"><div class="section-label2">'+tr2('BUYER','买方')+'</div>';
  h+='<div class="section-value">'+esc(d.buyerSignatureName||'—')+'</div><div class="section-value">'+esc(d.buyerSignatureTitle||'')+'</div><div class="section-value">'+esc(d.buyerSignatureDate||'')+'</div></div>';
  h+='</div></div>';

function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._tcRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._tcDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._tcClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._tcSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._tcItem=function(idx,f,v){data.items[idx][f]=v;autoCalcItem(DT,data.items[idx]);saveDocData(DT,data);};
window._tcAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._tcRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._tcRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._tcDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._tcClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._tcSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._tcSet(\''+f+'\',this.value)"></div>';}
