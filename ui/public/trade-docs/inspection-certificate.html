<script>
var DT='inspection_certificate',DT_META=DOC_META[DT],lang=getLang(),dark=isDark(),previewLang='en',data=null,showClearConfirm=false;

  document.getElementById('btn-switch-preview').onclick=function(){switchTab('preview');renderPreview();};document.getElementById('btn-back-edit').onclick=function(){switchTab('edit');};
  document.getElementById('btn-pdf').onclick=function(){doExportPdf(DT,data,'preview-content');};document.getElementById('btn-pdf-preview').onclick=function(){doExportPdf(DT,data,'preview-content');};
  document.getElementById('btn-preview-lang').onclick=function(){previewLang=previewLang==='en'?'zh':'en';renderPreview();};document.getElementById('btn-print').onclick=function(){window.print();};
  var h='';
  h+='<div class="section-card"><h3>'+fB(isZh?'证书信息':'Certificate Info','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'证书号':'Certificate No.',d.certificateNo,'certificateNo','');h+=lI(isZh?'发票号':'Invoice No.',d.invoiceNo,'invoiceNo','');
  h+=lI(isZh?'合同号':'Contract No.',d.contractNo,'contractNo','');h+=lID(isZh?'检验日期':'Date of Inspection',d.dateOfInspection,'dateOfInspection');
  h+=lID(isZh?'签发日期':'Date of Issue',d.dateOfIssue,'dateOfIssue');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'申请人与制造商':'Applicant & Manufacturer','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'申请人':'Applicant',d.applicantName,'applicantName','');h+=lI(isZh?'地址':'Address',d.applicantAddress,'applicantAddress','');
  h+=lI(isZh?'制造商':'Manufacturer',d.manufacturerName,'manufacturerName','');h+=lI(isZh?'地址':'Address',d.manufacturerAddress,'manufacturerAddress','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'收货人':'Consignee','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';

  h+='<div class="section-card"><h3>'+fB(isZh?'检验信息':'Inspection Info','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'检验标准':'Inspection Standard',d.inspectionStandard,'inspectionStandard','');h+=lI(isZh?'检验地点':'Inspection Location',d.inspectionLocation,'inspectionLocation','');
  h+=lI(isZh?'检验结果':'Inspection Result',d.inspectionResult,'inspectionResult','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'运输信息':'Transport Info','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'船名':'Vessel',d.vessel,'vessel','');h+=lI(isZh?'装货港':'Port of Loading',d.portOfLoading,'portOfLoading','');
  h+=lI(isZh?'卸货港':'Port of Discharge',d.portOfDischarge,'portOfDischarge','');h+=lI(isZh?'原产国':'Country of Origin',d.countryOfOrigin,'countryOfOrigin','');
  h+=lI(isZh?'目的国':'Destination Country',d.destinationCountry,'destinationCountry','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'货品明细':'Goods Details','')+'</h3>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  h+='<p style="font-size:13px;color:var(--text-muted);">'+(isZh?'逐项添加货品。':'Add items.')+'</p>';
  h+='<button class="btn btn-success btn-sm" onclick="window._icAddItem()">'+tr.addItem+'</button></div>';
  h+='<div class="items-table-container"><table class="items-table"><thead><tr>';
  ['#',isZh?'项号':'Item No.',isZh?'描述':'DESCRIPTION',isZh?'规格':'Specification',isZh?'数量':'QTY',isZh?'单位':'UNIT',isZh?'批次号':'Batch No.',isZh?'操作':'Action'].forEach(function(th){h+='<th>'+th+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="row-number">'+(idx+1)+'</td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.itemNo)+'" onchange="window._icItem('+idx+',\'itemNo\',this.value)"></td>';
    h+='<td class="description-cell"><textarea class="input-field input-field-sm" rows="2" onchange="window._icItem('+idx+',\'description\',this.value)">'+esc(it.description)+'</textarea></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.specification)+'" onchange="window._icItem('+idx+',\'specification\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.quantity)+'" onchange="window._icItem('+idx+',\'quantity\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.unitOfMeasure)+'" onchange="window._icItem('+idx+',\'unitOfMeasure\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.batchNo)+'" onchange="window._icItem('+idx+',\'batchNo\',this.value)"></td>';
    h+='<td class="actions"><button class="btn btn-danger" onclick="window._icRemoveItem('+idx+')" '+(d.items.length<=1?'disabled':'')+'>&times;</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'声明与认证':'Declaration & Certification','')+'</h3>';
  h+='<div><div class="form-label">'+(isZh?'声明内容':'Declaration')+'</div><textarea class="input-field" rows="3" onchange="window._icSet(\'declaration\',this.value)">'+esc(d.declaration)+'</textarea></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  h+=lI(isZh?'检验员':'Inspector',d.inspectorName,'inspectorName','');h+=lI(isZh?'认证机构':'Certifying Authority',d.certifyingAuthority,'certifyingAuthority','');
  h+=lID(isZh?'日期':'Date',d.signatureDate,'signatureDate');h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="header-title">'+tr2('INSPECTION CERTIFICATE','检验证书')+'</div>';
  h+='<table><tbody><tr><th style="width:25%;">'+tr2('CERTIFICATE NO.','证书号')+'</th><th style="width:25%;">'+tr2('INVOICE NO.','发票号')+'</th><th style="width:25%;">'+tr2('CONTRACT NO.','合同号')+'</th><th style="width:25%;">'+tr2('DATE','日期')+'</th></tr>';
  h+='<tr><td class="text-center">'+esc(d.certificateNo||'—')+'</td><td class="text-center">'+esc(d.invoiceNo||'—')+'</td><td class="text-center">'+esc(d.contractNo||'—')+'</td><td class="text-center">'+esc(d.dateOfIssue||'—')+'</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr><td style="width:33%;"><div class="section-label2">'+tr2('APPLICANT','申请人')+'</div>';
  h+='<div class="section-value">'+esc(d.applicantName||'—')+'</div><div class="section-value">'+esc(d.applicantAddress||'—')+'</div></td>';
  h+='<td style="width:33%;"><div class="section-label2">'+tr2('MANUFACTURER','制造商')+'</div>';
  h+='<div class="section-value">'+esc(d.manufacturerName||'—')+'</div><div class="section-value">'+esc(d.manufacturerAddress||'—')+'</div></td>';
  h+='<td style="width:33%;"><div class="section-label2">'+tr2('CONSIGNEE','收货人')+'</div>';
  h+='<div class="section-value">'+esc(d.consigneeName||'—')+'</div><div class="section-value">'+esc(d.consigneeAddress||'—')+'</div></td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('STANDARD','检验标准'),tr2('LOCATION','检验地点'),tr2('RESULT','检验结果')].forEach(function(t){h+='<th style="width:33%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.inspectionStandard,d.inspectionLocation,d.inspectionResult].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('ITEM NO.','项号'),tr2('DESCRIPTION','描述'),tr2('SPEC','规格'),tr2('QTY','数量'),tr2('UNIT','单位'),tr2('BATCH NO.','批次号')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td class="text-center">'+esc(it.itemNo||'—')+'</td><td>'+esc(it.description||'—')+'</td><td>'+esc(it.specification||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.quantity||'—')+'</td><td class="text-center">'+esc(it.unitOfMeasure||'—')+'</td><td class="text-center">'+esc(it.batchNo||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="mt-2"><div class="section-label2">'+tr2('DECLARATION','声明')+'</div><div class="section-value">'+esc(d.declaration)+'</div></div>';
  h+='<div class="mt-2" style="text-align:right;"><div class="section-label2">'+tr2('INSPECTOR','检验员')+'</div>';
  h+='<div class="section-value">'+esc(d.inspectorName||'—')+'</div><div class="section-value">'+esc(d.certifyingAuthority||'')+'</div>';
  h+='<div class="section-value">'+esc(d.signatureDate||'')+'</div></div></div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._icRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._icDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._icClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._icSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._icItem=function(idx,f,v){data.items[idx][f]=v;saveDocData(DT,data);};
window._icAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._icRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._icRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._icDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._icClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._icSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._icSet(\''+f+'\',this.value)"></div>';}
function loadSample(){var s=getDefaultDoc(DT);s.certificateNo='IC-2026-001';s.invoiceNo='INV-2026-001';s.contractNo='SC-2026-001';
s.dateOfInspection='2026-05-08';s.dateOfIssue='2026-05-10';
s.applicantName='Shanghai Export Co.';s.applicantAddress='No.123 Zhangjiang Rd, Shanghai';
s.manufacturerName='Zhejiang Manufacturing Ltd.';s.manufacturerAddress='No.456 Industrial Park, Hangzhou';
s.consigneeName='ABC Trading LLC';s.consigneeAddress='456 Fifth Ave, New York';
s.inspectionStandard='ISO 9001';s.inspectionLocation='Shanghai Factory';s.inspectionResult='Passed';
s.vessel='COSCO SHANGHAI';s.portOfLoading='Shanghai';s.portOfDischarge='New York';s.countryOfOrigin='China';s.destinationCountry='USA';
s.items=[{itemNo:'1',description:'Stainless Steel Water Bottle',specification:'500ml, 304 SS',quantity:'500',unitOfMeasure:'pcs',batchNo:'BATCH-2026-001'},
{itemNo:'2',description:'Thermal Flask',specification:'750ml',quantity:'200',unitOfMeasure:'pcs',batchNo:'BATCH-2026-002'}];
s.declaration='We hereby certify that the goods have been inspected and found to be in conformity with the contract specifications.';
s.inspectorName='Inspector Chen';s.certifyingAuthority='SGS Shanghai';s.signatureDate='2026-05-10';
data=s;saveDocData(DT,data);renderAll();}
init();
</script>
