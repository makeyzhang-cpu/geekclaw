<script>
var DT='customs_declaration',DT_META=DOC_META[DT],lang=getLang(),dark=isDark(),previewLang='en',data=null,showClearConfirm=false;

function renderForm(){

  document.getElementById('btn-switch-preview').onclick=function(){switchTab('preview');renderPreview();};document.getElementById('btn-back-edit').onclick=function(){switchTab('edit');};
  document.getElementById('btn-pdf').onclick=function(){doExportPdf(DT,data,'preview-content');};document.getElementById('btn-pdf-preview').onclick=function(){doExportPdf(DT,data,'preview-content');};
  document.getElementById('btn-preview-lang').onclick=function(){previewLang=previewLang==='en'?'zh':'en';renderPreview();};document.getElementById('btn-print').onclick=function(){window.print();};
  var h='';

  h+=lI(isZh?'电话':'Phone',d.declarantPhone,'declarantPhone','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'买卖双方':'Shipper & Consignee','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  h+=lI(isZh?'发货人':'Shipper',d.shipperName,'shipperName','');h+=lI(isZh?'收货人':'Consignee',d.consigneeName,'consigneeName','');
  h+=lI(isZh?'贸易方式':'Trade Mode',d.tradeMode,'tradeMode','');h+=lI(isZh?'海关口岸':'Customs Port',d.customsPort,'customsPort','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'运输与合同':'Transport & Contract','')+'</h3><div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  h+=lI(isZh?'合同号':'Contract No.',d.contractNo,'contractNo','');h+=lI(isZh?'发票号':'Invoice No.',d.invoiceNo,'invoiceNo','');
  h+=lI(isZh?'提单号':'B/L No.',d.blNo,'blNo','');h+=lID(isZh?'申报日期':'Date of Declaration',d.dateOfDeclaration,'dateOfDeclaration');
  h+=lID(isZh?'出口日期':'Date of Export',d.dateOfExport,'dateOfExport');h+=lI(isZh?'运输方式':'Transport Mode',d.transportMode,'transportMode','');
  h+=lI(isZh?'船名':'Vessel',d.vessel,'vessel','');h+=lI(isZh?'货币':'Currency',d.currency,'currency','');
  h+=lI(isZh?'付款条款':'Payment Terms',d.paymentTerms,'paymentTerms','');h+='</div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'商品明细':'Goods Details','')+'</h3>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  h+='<p style="font-size:13px;color:var(--text-muted);">'+(isZh?'逐项添加商品。':'Add items.')+'</p>';
  h+='<button class="btn btn-success btn-sm" onclick="window._cdAddItem()">'+tr.addItem+'</button></div>';
  h+='<div class="items-table-container"><table class="items-table"><thead><tr>';
  ['#',isZh?'项号':'No.',isZh?'HS编码':'HS Code',isZh?'描述':'DESCRIPTION',isZh?'规格':'Specification',
   isZh?'数量':'QTY',isZh?'单位':'UNIT',isZh?'单价':'Unit Price',isZh?'总价':'Total',
   isZh?'原产国':'Origin',isZh?'目的国':'Dest.',isZh?'操作':'Action'].forEach(function(th){h+='<th>'+th+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="row-number">'+(idx+1)+'</td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.itemNo)+'" onchange="window._cdItem('+idx+',\'itemNo\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.hsCode)+'" onchange="window._cdItem('+idx+',\'hsCode\',this.value)"></td>';
    h+='<td class="description-cell"><textarea class="input-field input-field-sm" rows="2" onchange="window._cdItem('+idx+',\'description\',this.value)">'+esc(it.description)+'</textarea></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.specification)+'" onchange="window._cdItem('+idx+',\'specification\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" type="number" min="0" value="'+esc(it.quantity)+'" onchange="window._cdItem('+idx+',\'quantity\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-center" value="'+esc(it.unitOfMeasure)+'" onchange="window._cdItem('+idx+',\'unitOfMeasure\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="'+esc(it.unitPrice)+'" onchange="window._cdItem('+idx+',\'unitPrice\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs text-right" value="'+esc(it.totalAmount)+'" onchange="window._cdItem('+idx+',\'totalAmount\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.originCountry)+'" onchange="window._cdItem('+idx+',\'originCountry\',this.value)"></td>';
    h+='<td><input class="input-field input-field-xs" value="'+esc(it.destinationCountry)+'" onchange="window._cdItem('+idx+',\'destinationCountry\',this.value)"></td>';
    h+='<td class="actions"><button class="btn btn-danger" onclick="window._cdRemoveItem('+idx+')" '+(d.items.length<=1?'disabled':'')+'>&times;</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="totals-summary"><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;">';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总价值':'Total Value')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalValue||'—')+'</span></div>';
  h+='<div><span style="font-size:12px;color:#6b7280;">'+(isZh?'总重量':'Total Weight')+'</span><br><span style="font-size:18px;font-weight:700;color:#4a0e4e;">'+(d.totalWeight||'—')+'</span></div>';
  h+='</div></div></div>';
  h+='<div class="section-card"><h3>'+fB(isZh?'声明与签署':'Declaration & Signature','')+'</h3>';
  h+='<div><div class="form-label">'+(isZh?'声明内容':'Declaration')+'</div><textarea class="input-field" rows="2" onchange="window._cdSet(\'declaration\',this.value)">'+esc(d.declaration)+'</textarea></div>';
  h+='<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-top:12px;">';
  h+=lI(isZh?'申报人签名':'Declarant Signature',d.declarantSignature,'declarantSignature','');
  h+=lID(isZh?'日期':'Date',d.signatureDate,'signatureDate');h+='</div></div>';
  document.getElementById('form-container').innerHTML=h;
}
function renderPreview(){
  var d=data,isZh2=previewLang==='zh';
  function tr2(en,zh){return isZh2?zh:en;}
  var h='<div class="invoice-preview" id="preview-content">';
  h+='<div class="header-title">'+tr2('CUSTOMS DECLARATION','报关单')+'</div>';
  h+='<table><tbody><tr><th style="width:25%;">'+tr2('DECLARANT','申报人')+'</th><th style="width:25%;">'+tr2('TRADE MODE','贸易方式')+'</th><th style="width:25%;">'+tr2('CUSTOMS PORT','海关口岸')+'</th><th style="width:25%;">'+tr2('TRANSPORT','运输方式')+'</th></tr>';
  h+='<tr><td class="text-center">'+esc(d.declarantName||'—')+'</td><td class="text-center">'+esc(d.tradeMode||'—')+'</td><td class="text-center">'+esc(d.customsPort||'—')+'</td><td class="text-center">'+esc(d.transportMode||'—')+' / '+esc(d.vessel||'')+'</td></tr></tbody></table>';
  h+='<table class="mt-2"><tbody><tr>';
  [tr2('CONTRACT NO.','合同号'),tr2('INVOICE NO.','发票号'),tr2('B/L NO.','提单号'),tr2('CURRENCY','货币'),tr2('DATE','日期')].forEach(function(t){h+='<th style="width:20%;">'+t+'</th>';});
  h+='</tr><tr>';
  [d.contractNo,d.invoiceNo,d.blNo,d.currency,d.dateOfExport].forEach(function(v){h+='<td class="text-center">'+esc(v||'—')+'</td>';});
  h+='</tr></tbody></table>';
  h+='<table class="mt-2"><thead><tr>';
  ['#',tr2('HS CODE','HS编码'),tr2('DESCRIPTION','描述'),tr2('SPEC','规格'),tr2('QTY','数量'),tr2('UNIT','单位'),tr2('UNIT PRICE','单价'),tr2('TOTAL','总价'),tr2('ORIGIN','原产国'),tr2('DEST','目的国')].forEach(function(t){h+='<th>'+t+'</th>';});
  h+='</tr></thead><tbody>';
  d.items.forEach(function(it,idx){
    h+='<tr><td class="text-center">'+(idx+1)+'</td><td>'+esc(it.hsCode||'—')+'</td><td>'+esc(it.description||'—')+'</td><td>'+esc(it.specification||'—')+'</td>';
    h+='<td class="text-center">'+esc(it.quantity||'—')+'</td><td class="text-center">'+esc(it.unitOfMeasure||'—')+'</td>';
    h+='<td class="text-right">'+esc(it.unitPrice||'—')+'</td><td class="text-right">'+esc(it.totalAmount||'—')+'</td><td>'+esc(it.originCountry||'—')+'</td><td>'+esc(it.destinationCountry||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="mt-2"><div class="section-label2">'+tr2('DECLARATION','声明')+'</div><div class="section-value">'+esc(d.declaration)+'</div></div>';
  h+='<div class="mt-2" style="text-align:right;"><div class="section-label2">'+tr2('SIGNATURE','签名')+'</div>';
  h+='<div class="section-value">'+esc(d.declarantSignature||'—')+'</div><div class="section-value">'+esc(d.signatureDate||'')+'</div></div></div>';
  document.getElementById('preview-container').innerHTML=h;
}
function renderHistory(){
  var tr=I18N[lang],snaps=loadSnapshots(DT),search=(document.getElementById('history-search').value||'').toLowerCase();
  if(search)snaps=snaps.filter(function(s){return(s.label||'').toLowerCase().indexOf(search)!==-1||(s.ref||'').toLowerCase().indexOf(search)!==-1;});
  var h='';if(snaps.length===0){h+='<div class="history-empty">'+svg('Clock',48)+'<p>'+tr.noHistory+'</p></div>';}
  else{h+='<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">'+snaps.length+' '+tr.records+'</div><div class="history-list">';
  snaps.forEach(function(s){h+='<div class="history-item"><div class="history-item-info"><div class="history-item-label">'+esc(s.label||'draft')+'</div>';
  h+='<div class="history-item-ref">'+esc(s.ref||'')+' — '+formatDateTime(s.exportedAt)+'</div></div><div class="history-item-actions">';
  h+='<button class="btn btn-secondary btn-sm" onclick="window._cdRestore(\''+s.id+'\')">'+tr.restore+'</button>';
  h+='<button class="btn btn-danger btn-sm" onclick="window._cdDeleteSnap(\''+s.id+'\')">'+tr.delete+'</button></div></div>';});
  h+='</div><div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._cdClearAllHistory()">'+tr.clearAll+'</button></div>';}
  document.getElementById('history-container').innerHTML=h;document.getElementById('history-search').oninput=function(){renderHistory();};
}
function renderClearModal(){var tr=I18N[lang],m=document.getElementById('clear-modal');if(showClearConfirm){m.classList.remove('hidden');
document.getElementById('clear-title').textContent=tr.clearTitle;document.getElementById('clear-msg').textContent=tr.clearMsg;
document.getElementById('btn-cancel-clear').textContent=tr.cancel;document.getElementById('btn-confirm-clear').textContent=tr.clear;}else m.classList.add('hidden');}
document.getElementById('lang-btn').onclick=function(){lang=lang==='zh'?'en':'zh';setLang(lang);renderAll();};
document.getElementById('theme-btn').onclick=function(){dark=!dark;setTheme(dark);applyTheme();renderAll();};
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
document.getElementById('btn-cancel-clear').onclick=function(){showClearConfirm=false;renderClearModal();};
document.getElementById('btn-confirm-clear').onclick=function(){data=getDefaultDoc(DT);saveDocData(DT,data);showClearConfirm=false;renderClearModal();renderForm();renderPreview();};
window._cdSet=function(f,v){data[f]=v;saveDocData(DT,data);};
window._cdItem=function(idx,f,v){data.items[idx][f]=v;saveDocData(DT,data);};
window._cdAddItem=function(){data.items.push(getEmptyItem(DT));saveDocData(DT,data);renderForm();};
window._cdRemoveItem=function(idx){if(data.items.length>1){data.items.splice(idx,1);saveDocData(DT,data);renderForm();}};
window._cdRestore=function(id){var snaps=loadSnapshots(DT),s=snaps.find(function(x){return x.id===id;});if(s&&s.data){data=JSON.parse(JSON.stringify(s.data));saveDocData(DT,data);renderAll();}};
window._cdDeleteSnap=function(id){deleteSnapshot(DT,id);renderHistory();};window._cdClearAllHistory=function(){clearAllSnapshots(DT);renderHistory();};
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fB(t,s){return t+(s?' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">'+s+'</span>':'');}
function lI(l,v,f,p){return '<div><div class="form-label">'+l+'</div><input class="input-field" value="'+esc(v)+'" onchange="window._cdSet(\''+f+'\',this.value)" placeholder="'+(p||'')+'"></div>';}
function lID(l,v,f){return '<div><div class="form-label">'+l+'</div><input class="input-field" type="date" value="'+esc(v)+'" onchange="window._cdSet(\''+f+'\',this.value)"></div>';}
function loadSample(){var s=getDefaultDoc(DT);s.declarantName='Customs Broker Zhang';s.declarantCode='DEC-3101';s.declarantPhone='+86 21 5555 0001';
s.shipperName='Shanghai Export Co.';s.consigneeName='ABC Trading LLC';s.tradeMode='General Trade';s.customsPort='Shanghai Pudong';
s.contractNo='SC-2026-001';s.invoiceNo='INV-2026-001';s.blNo='BL-2026-001';s.dateOfDeclaration='2026-05-10';s.dateOfExport='2026-05-15';
s.transportMode='Sea';s.vessel='COSCO SHANGHAI';s.currency='USD';s.paymentTerms='T/T';
s.items=[{itemNo:'1',hsCode:'7323.93',description:'Stainless Steel Water Bottle',specification:'500ml',quantity:'500',unitOfMeasure:'pcs',unitPrice:'3.50',totalAmount:'1750.00',originCountry:'China',destinationCountry:'USA'},
{itemNo:'2',hsCode:'7323.93',description:'Thermal Flask',specification:'750ml',quantity:'200',unitOfMeasure:'pcs',unitPrice:'5.80',totalAmount:'1160.00',originCountry:'China',destinationCountry:'USA'}];
s.totalValue='2910.00 USD';s.totalWeight='235.00 KG';s.declaration='I hereby declare that the information provided is true and accurate.';
s.declarantSignature='Zhang Wei';s.signatureDate='2026-05-10';
data=s;saveDocData(DT,data);renderAll();}
init();
</script>
