    <div class="action-bar">

    <!-- Form -->
    <div id="form-container"></div>
  </div>

  <!-- Preview Tab -->
  <div class="tab-panel" id="panel-preview">

        <button class="btn btn-secondary btn-sm" id="btn-back-edit"></button>
        <button class="btn btn-secondary btn-sm" id="btn-preview-lang"></button>
      </div>
      <div class="action-bar-right">
        <button class="btn btn-primary" id="btn-pdf-preview" data-pdf-btn></button>

  <!-- History Tab -->

<!-- Clear Confirmation Modal -->
<div class="clear-modal hidden" id="clear-modal">

        <button class="btn btn-danger" id="btn-confirm-clear"></button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
// ===== Document Type =====
var DT = 'commercial_invoice';
var DT_META = DOC_META[DT];

// ===== State =====
var lang = getLang();
var dark = isDark();
var previewLang = 'en';
var data = null;
var showClearConfirm = false;

// ===== Initialize =====
function init() {
  applyTheme();
  injectSpaButton();
  injectBottomCta();
  injectPageFaq();
  var saved = loadDocData(DT);
  data = saved ? saved : getDefaultDoc(DT);
  renderAll();
}

// ===== Render All =====
function renderAll() {
  renderTopBar();
  renderHeader();
  renderTabs();
  renderForm();
  renderPreview();
  renderHistory();
  renderClearModal();
}

// ===== Top Bar =====
function renderTopBar() {
  var tr = I18N[lang];
  document.documentElement.lang = lang;
  document.getElementById('back-icon').innerHTML = svg('ArrowLeft', 16);
  document.getElementById('back-text').textContent = tr.backHome;
  document.getElementById('lang-icon').innerHTML = svg('Languages', 16);
  document.getElementById('lang-label').textContent = lang === 'zh' ? 'EN' : '中文';
  document.getElementById('theme-icon').innerHTML = svg(dark ? 'Sun' : 'Moon', 16);
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
}

// ===== Header =====
function renderHeader() {
  document.getElementById('page-title').textContent = DT_META.title;
  document.getElementById('page-subtitle').textContent = DT_META.titleZh;
}

// ===== Tabs =====
function renderTabs() {
  var tr = I18N[lang];
  document.getElementById('tab-edit').textContent = tr.formEditor;
  document.getElementById('tab-preview').textContent = tr.previewTab;
  document.getElementById('tab-history').textContent = tr.historyTab;

  var panels = ['edit', 'preview', 'history'];
  panels.forEach(function(p) {
    document.getElementById('tab-' + p).onclick = function() {
      panels.forEach(function(pp) {
        document.getElementById('tab-' + pp).classList.toggle('active', pp === p);
        document.getElementById('panel-' + pp).classList.toggle('active', pp === p);
      });
    };
  });
}

// ===== Switch to tab =====
function switchTab(tab) {
  ['edit','preview','history'].forEach(function(p) {
    document.getElementById('tab-' + p).classList.toggle('active', p === tab);
    document.getElementById('panel-' + p).classList.toggle('active', p === tab);
  });
}

// ===== Form Rendering =====
function renderForm() {
  var tr = I18N[lang];
  var isZh = lang === 'zh';

  // Load sample button
  document.getElementById('btn-load-sample').textContent = tr.loadSample;
  document.getElementById('btn-clear').textContent = tr.clear;
  document.getElementById('btn-switch-preview').textContent = tr.preview;
  document.getElementById('btn-pdf').textContent = tr.exportPdf;
  document.getElementById('btn-back-edit').textContent = tr.backEdit;
  document.getElementById('btn-preview-lang').textContent = previewLang === 'en' ? 'Switch to 中文' : 'Switch to English';
  document.getElementById('btn-pdf-preview').textContent = tr.exportPdf;
  document.getElementById('btn-print').textContent = tr.print;
  document.getElementById('history-search').placeholder = tr.searchPlaceholder;

  // Action bar button handlers
  document.getElementById('btn-load-sample').onclick = loadSample;
  document.getElementById('btn-clear').onclick = function() { showClearConfirm = true; renderClearModal(); };
  document.getElementById('btn-switch-preview').onclick = function() { switchTab('preview'); renderPreview(); };
  document.getElementById('btn-back-edit').onclick = function() { switchTab('edit'); };
  document.getElementById('btn-pdf').onclick = function() { doExportPdf(DT, data, 'preview-content'); };
  document.getElementById('btn-pdf-preview').onclick = function() { doExportPdf(DT, data, 'preview-content'); };
  document.getElementById('btn-preview-lang').onclick = function() { previewLang = previewLang === 'en' ? 'zh' : 'en'; renderPreview(); };
  document.getElementById('btn-print').onclick = function() { window.print(); };

  var isZh = lang === 'zh';
  var d = data;
  var subtotal = d.items.reduce(function(s, it) { return s + (parseFloat(it.totalValue) || 0); }, 0);
  var totalPkgs = d.items.reduce(function(s, it) { return s + (parseFloat(it.noOfPkgs) || 0); }, 0);
  var totalWeight = d.items.reduce(function(s, it) { return s + (parseFloat(it.weight) || 0); }, 0);

  function set(field, value) {
    data[field] = value;
    saveDocData(DT, data);
  }

  function setItem(idx, field, value) {
    data.items[idx][field] = value;
    autoCalcItem(DT, data.items[idx]);
    saveDocData(DT, data);
    renderForm();
  }

  var html = '';

  // Logo Upload
  html += '<div class="section-card">';
  html += '<h3>' + (isZh ? '企业信息 & Logo' : 'Company Info & Logo') + '</h3>';
  html += '<div class="logo-upload">';
  html += '  <div class="logo-upload-label">' + tr.logoLabel + '</div>';
  html += '  <div style="display:flex;align-items:center;gap:12px;">';
  if (d.logo) {
    html += '  <div class="logo-preview-wrap">';
    html += '    <img src="' + d.logo + '" alt="logo">';
    html += '    <button class="logo-remove" onclick="window._ciRemoveLogo()">X</button>';
    html += '  </div>';
  } else {
    html += '  <label class="logo-upload-btn">';
    html += '    ' + svg('Upload', 14);
    html += '    <span>' + tr.uploadLogo + '</span>';
    html += '    <input type="file" accept="image/*" onchange="window._ciLogoUpload(event)">';
    html += '  </label>';
  }
  html += '  <span class="logo-upload-hint">' + tr.logoHint + '</span>';
  html += '  </div>';
  html += '</div>';

  // Shipper / Exporter
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));">';
  html += fieldBlock(isZh ? '发货人/出口商' : 'Shipper / Exporter', '');
  html += '<div class="form-label">' + (isZh ? '姓名' : 'Name') + '</div>';
  html += '<input class="input-field" value="' + esc(d.shipperName) + '" onchange="window._ciSet(\'shipperName\',this.value)" placeholder="' + (isZh ? '发货人姓名' : 'Shipper name') + '">';
  html += '<div class="form-label">' + (isZh ? '地址' : 'Address') + '</div>';
  html += '<textarea class="input-field" rows="2" onchange="window._ciSet(\'shipperAddress\',this.value)" placeholder="' + (isZh ? '完整地址' : 'Full address') + '">' + esc(d.shipperAddress) + '</textarea>';
  html += '<div class="form-label">' + (isZh ? '电话' : 'Phone') + '</div>';
  html += '<input class="input-field" type="tel" value="' + esc(d.shipperPhone) + '" onchange="window._ciSet(\'shipperPhone\',this.value)" placeholder="+86">';
  html += '<div class="form-label">' + (isZh ? '税号' : 'Tax ID') + '</div>';
  html += '<input class="input-field" value="' + esc(d.shipperTaxId) + '" onchange="window._ciSet(\'shipperTaxId\',this.value)" placeholder="VAT / GST / EIN">';
  html += '</div>';

  // Consignee
  html += '<div style="margin-top:20px;"></div>';
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));">';
  html += fieldBlock(isZh ? '收货人' : 'Consignee', '');
  html += '<div class="form-label">' + (isZh ? '姓名' : 'Name') + '</div>';
  html += '<input class="input-field" value="' + esc(d.consigneeName) + '" onchange="window._ciSet(\'consigneeName\',this.value)" placeholder="' + (isZh ? '收货人姓名' : 'Consignee name') + '">';
  html += '<div class="form-label">' + (isZh ? '公司' : 'Company') + '</div>';
  html += '<input class="input-field" value="' + esc(d.consigneeCompany) + '" onchange="window._ciSet(\'consigneeCompany\',this.value)" placeholder="' + (isZh ? '公司名称' : 'Company name') + '">';
  html += '<div class="form-label">' + (isZh ? '地址' : 'Address') + '</div>';
  html += '<textarea class="input-field" rows="2" onchange="window._ciSet(\'consigneeAddress\',this.value)" placeholder="' + (isZh ? '完整地址' : 'Full address') + '">' + esc(d.consigneeAddress) + '</textarea>';
  html += '<div class="form-label">' + (isZh ? '电话' : 'Phone') + '</div>';
  html += '<input class="input-field" type="tel" value="' + esc(d.consigneePhone) + '" onchange="window._ciSet(\'consigneePhone\',this.value)" placeholder="+1">';
  html += '<div class="form-label">' + (isZh ? '税号' : 'Tax ID') + '</div>';
  html += '<input class="input-field" value="' + esc(d.consigneeTaxId) + '" onchange="window._ciSet(\'consigneeTaxId\',this.value)" placeholder="Tax ID">';
  html += '</div>';

  // Importer (optional)
  html += '<div style="margin-top:20px;"></div>';
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));">';
  html += fieldBlock(isZh ? '进口人（非收货人时）' : 'Importer — If Other Than Consignee', '');
  html += '<div class="form-label">' + (isZh ? '姓名' : 'Name') + '</div>';
  html += '<input class="input-field" value="' + esc(d.importerName) + '" onchange="window._ciSet(\'importerName\',this.value)" placeholder="' + (isZh ? '进口人姓名' : 'Importer name') + '">';
  html += '<div class="form-label">' + (isZh ? '地址' : 'Address') + '</div>';
  html += '<textarea class="input-field" rows="2" onchange="window._ciSet(\'importerAddress\',this.value)" placeholder="' + (isZh ? '完整地址' : 'Full address') + '">' + esc(d.importerAddress) + '</textarea>';
  html += '<div class="form-label">' + (isZh ? '电话' : 'Phone') + '</div>';
  html += '<input class="input-field" type="tel" value="' + esc(d.importerPhone) + '" onchange="window._ciSet(\'importerPhone\',this.value)" placeholder="+1">';
  html += '<div class="form-label">' + (isZh ? '税号' : 'Tax ID') + '</div>';
  html += '<input class="input-field" value="' + esc(d.importerTaxId) + '" onchange="window._ciSet(\'importerTaxId\',this.value)" placeholder="Tax ID">';
  html += '</div>';

  // Invoice Details
  html += '<div style="margin-top:20px;"></div>';
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  html += fieldBlock(isZh ? '发票信息' : 'Invoice Details', '');
  html += labelInput(isZh ? '发票号码' : 'Invoice No.', d.invoiceNo, 'invoiceNo', isZh ? 'INV-2026-001' : 'INV-2026-001');
  html += labelInput(isZh ? '订单号' : 'PO / Reference No.', d.poNo, 'poNo', isZh ? 'PO-2026-001' : 'PO-2026-001');
  html += labelInputDate(isZh ? '出口日期' : 'Date of Export', d.dateOfExport, 'dateOfExport');
  html += labelInput(isZh ? '信用证号' : 'L/C No.', d.lCNo, 'lCNo', isZh ? 'L/C number' : 'L/C number');
  html += labelInput(isZh ? '运单号' : 'Waybill No.', d.waybillNo, 'waybillNo', isZh ? '运单号码' : 'Waybill number');
  html += labelSelect(isZh ? '出口原因' : 'Reason for Export', d.reasonForExport, 'reasonForExport', [
    ['commercial', isZh ? '商业' : 'Commercial'],
    ['personal_gift', isZh ? '个人礼品' : 'Personal Gift'],
    ['repair', isZh ? '维修退货' : 'Return for Repair'],
    ['other', isZh ? '其他' : 'Other']
  ]);
  html += '</div>';

  // Commercial Terms
  html += '<div style="margin-top:20px;"></div>';
  html += '<div class="field-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));">';
  html += fieldBlock(isZh ? '商业条款' : 'Commercial Terms', '');
  html += labelInput(isZh ? '付款条件' : 'Payment Terms', d.paymentTerms, 'paymentTerms', 'T/T, L/C');
  html += labelSelect(isZh ? '币种' : 'Currency', d.currency, 'currency', CURRENCIES.map(function(c) { return [c, c + ' - ' + CURRENCY_NAMES[c]]; }));
  html += labelInput(isZh ? '出口国家' : 'Country of Export', d.exportCountry, 'exportCountry', isZh ? '如: China' : 'e.g. China');
  html += labelInput(isZh ? '目的地国家' : 'Destination Country', d.destinationCountry, 'destinationCountry', isZh ? '如: United States' : 'e.g. United States');
  html += '</div>';

  // Items Table
  html += '<div style="margin-top:20px;"></div>';
  html += fieldBlock(isZh ? '商品明细' : 'Goods Description', '');
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<p style="font-size:13px;color:var(--text-muted);">' + (isZh ? '逐项添加商品，行总价 = 数量 × 单价。' : 'Add items. Total = qty × unit price.') + '</p>';
  html += '<button class="btn btn-success btn-sm" onclick="window._ciAddItem()">' + tr.addItem + '</button>';
  html += '</div>';
  html += '<div class="items-table-container">';
  html += '<table class="items-table">';
  html += '<thead><tr>';
  var ths = ['#',
    (isZh ? '唛头' : 'MARKS') + '<span class="col-label-cn">' + (isZh ? '唛头' : 'Marks') + '</span>',
    (isZh ? '件数' : 'NO. PKGS') + '<span class="col-label-cn">' + (isZh ? '包装件数' : 'No. of Packages') + '</span>',
    (isZh ? '包装类型' : 'PACKAGING') + '<span class="col-label-cn">' + (isZh ? '包装类型' : 'Packaging Type') + '</span>',
    (isZh ? '原产国' : 'ORIGIN') + '<span class="col-label-cn">' + (isZh ? '原产国' : 'Country of Origin') + '</span>',
    (isZh ? '货品描述' : 'DESCRIPTION') + '<span class="col-label-cn">' + (isZh ? '货品完整描述' : 'Full Description') + '</span>',
    (isZh ? 'HS编码' : 'HS CODE') + '<span class="col-label-cn">' + (isZh ? '海关编码' : 'HS Code') + '</span>',
    (isZh ? '数量' : 'QTY') + '<span class="col-label-cn">' + (isZh ? '数量' : 'Quantity') + '</span>',
    (isZh ? '单位' : 'UNIT') + '<span class="col-label-cn">' + (isZh ? '计量单位' : 'Unit of Measure') + '</span>',
    (isZh ? '重量' : 'WEIGHT') + '<span class="col-label-cn">' + (isZh ? '重量(KG)' : 'Weight (KG)') + '</span>',
    (isZh ? '单价' : 'UNIT VALUE') + '<span class="col-label-cn">' + (isZh ? '单价' : 'Unit Price') + '</span>',
    (isZh ? '总价' : 'TOTAL VALUE') + '<span class="col-label-cn">' + (isZh ? '行总价' : 'Line Total') + '</span>',
    isZh ? '操作' : 'Action'
  ];
  ths.forEach(function(th) { html += '<th>' + th + '</th>'; });
  html += '</tr></thead>';
  html += '<tbody>';
  data.items.forEach(function(item, idx) {
    html += '<tr>';
    html += '<td class="row-number">' + (idx + 1) + '</td>';
    html += '<td><input class="input-field input-field-xs" value="' + esc(item.marks) + '" onchange="window._ciItem(' + idx + ',\'marks\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-center" type="number" min="0" value="' + esc(item.noOfPkgs) + '" onchange="window._ciItem(' + idx + ',\'noOfPkgs\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs" value="' + esc(item.typeOfPackaging) + '" onchange="window._ciItem(' + idx + ',\'typeOfPackaging\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs" value="' + esc(item.countryOfOrigin) + '" onchange="window._ciItem(' + idx + ',\'countryOfOrigin\',this.value)"></td>';
    html += '<td class="description-cell"><textarea class="input-field input-field-sm" rows="3" onchange="window._ciItem(' + idx + ',\'description\',this.value)">' + esc(item.description) + '</textarea></td>';
    html += '<td><input class="input-field input-field-xs" value="' + esc(item.hsCode) + '" onchange="window._ciItem(' + idx + ',\'hsCode\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-center" type="number" min="0" value="' + esc(item.qty) + '" onchange="window._ciItem(' + idx + ',\'qty\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-center" value="' + esc(item.unitOfMeasure) + '" onchange="window._ciItem(' + idx + ',\'unitOfMeasure\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-center" type="number" min="0" step="0.01" value="' + esc(item.weight) + '" onchange="window._ciItem(' + idx + ',\'weight\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-right" type="number" min="0" step="0.01" value="' + esc(item.unitValue) + '" onchange="window._ciItem(' + idx + ',\'unitValue\',this.value)"></td>';
    html += '<td><input class="input-field input-field-xs text-right font-medium" type="number" min="0" step="0.01" value="' + esc(item.totalValue) + '" onchange="window._ciItem(' + idx + ',\'totalValue\',this.value)"></td>';
    html += '<td class="actions"><button class="btn btn-danger" onclick="window._ciRemoveItem(' + idx + ')" ' + (data.items.length <= 1 ? 'disabled' : '') + '>&times;</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // Totals
  html += '<div class="totals-summary">';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:12px;">';

// ===== History =====
function renderHistory() {
  var tr = I18N[lang];
  var snaps = loadSnapshots(DT);
  var search = (document.getElementById('history-search').value || '').toLowerCase();
  if (search) {
    snaps = snaps.filter(function(s) {
      return (s.label || '').toLowerCase().indexOf(search) !== -1 ||
             (s.ref || '').toLowerCase().indexOf(search) !== -1 ||
             (s.exportedAt || '').toLowerCase().indexOf(search) !== -1;
    });
  }

  var html = '';
  if (snaps.length === 0) {
    html += '<div class="history-empty">';
    html += svg('Clock', 48);
    html += '<p>' + tr.noHistory + '</p>';
    html += '</div>';
  } else {
    html += '<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">' + snaps.length + ' ' + tr.records + '</div>';
    html += '<div class="history-list">';
    snaps.forEach(function(s) {
      html += '<div class="history-item">';
      html += '<div class="history-item-info">';
      html += '<div class="history-item-label">' + esc(s.label || 'draft') + '</div>';
      html += '<div class="history-item-ref">' + esc(s.ref || '') + ' — ' + formatDateTime(s.exportedAt) + '</div>';
      html += '</div>';
      html += '<div class="history-item-actions">';
      html += '<button class="btn btn-secondary btn-sm" onclick="window._ciRestore(\'' + s.id + '\')">' + tr.restore + '</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="window._ciDeleteSnap(\'' + s.id + '\')">' + tr.delete + '</button>';
      html += '</div></div>';
    });
    html += '</div>';
    html += '<div style="margin-top:16px;"><button class="btn btn-secondary btn-sm" onclick="window._ciClearAllHistory()">' + tr.clearAll + '</button></div>';
  }
  document.getElementById('history-container').innerHTML = html;

  // Search handler
  document.getElementById('history-search').oninput = function() { renderHistory(); };
}

// ===== Clear Modal =====
function renderClearModal() {
  var tr = I18N[lang];
  var modal = document.getElementById('clear-modal');
  if (showClearConfirm) {
    modal.classList.remove('hidden');
    document.getElementById('clear-title').textContent = tr.clearTitle;
    document.getElementById('clear-msg').textContent = tr.clearMsg;
    document.getElementById('btn-cancel-clear').textContent = tr.cancel;
    document.getElementById('btn-confirm-clear').textContent = tr.clear;
  } else {
    modal.classList.add('hidden');
  }
}

// ===== Event Handlers =====
document.getElementById('lang-btn').onclick = function() {
  lang = lang === 'zh' ? 'en' : 'zh';
  setLang(lang);
  renderAll();
};
document.getElementById('theme-btn').onclick = function() {
  dark = !dark;
  setTheme(dark);
  applyTheme();
  renderAll();
};
document.getElementById('btn-cancel-clear').onclick = function() { showClearConfirm = false; renderClearModal(); };
document.getElementById('btn-confirm-clear').onclick = function() {
  data = getDefaultDoc(DT);
  saveDocData(DT, data);
  showClearConfirm = false;
  renderClearModal();
  renderForm();
  renderPreview();
};

// ===== Window-level helpers for inline event handlers =====
window._ciSet = function(field, value) {
  data[field] = value;
  saveDocData(DT, data);
};
window._ciItem = function(idx, field, value) {
  data.items[idx][field] = value;
  autoCalcItem(DT, data.items[idx]);
  saveDocData(DT, data);
  renderForm();
};
window._ciAddItem = function() {
  data.items.push(getEmptyItem(DT));
  saveDocData(DT, data);
  renderForm();
};
window._ciRemoveItem = function(idx) {
  if (data.items.length > 1) {
    data.items.splice(idx, 1);
    saveDocData(DT, data);
    renderForm();
  }
};
window._ciRestore = function(id) {
  var snaps = loadSnapshots(DT);
  var snap = snaps.find(function(s) { return s.id === id; });
  if (snap && snap.data) {
    data = JSON.parse(JSON.stringify(snap.data));
    saveDocData(DT, data);
    renderAll();
  }
};
window._ciDeleteSnap = function(id) {
  deleteSnapshot(DT, id);
  renderHistory();
};
window._ciClearAllHistory = function() {
  clearAllSnapshots(DT);
  renderHistory();
};
window._ciLogoUpload = function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    if (typeof ev.target.result === 'string') {
      data.logo = ev.target.result;
      saveDocData(DT, data);
      renderForm();
    }
  };
  reader.readAsDataURL(file);
};
window._ciRemoveLogo = function() {
  data.logo = '';
  saveDocData(DT, data);
  renderForm();
};

// ===== Helpers for form HTML =====
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fieldBlock(title, subtitle) {
  return '<div style="grid-column:1/-1;"><h3 style="font-size:16px;font-weight:600;color:var(--primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-color);">' + title + (subtitle ? ' <span style="font-size:12px;color:var(--text-muted);font-weight:400;">' + subtitle + '</span>' : '') + '</h3></div>';
}
function labelInput(label, value, field, placeholder) {
  return '<div><div class="form-label">' + label + '</div><input class="input-field" value="' + esc(value) + '" onchange="window._ciSet(\'' + field + '\',this.value)" placeholder="' + (placeholder || '') + '"></div>';
}
function labelInputDate(label, value, field) {
  return '<div><div class="form-label">' + label + '</div><input class="input-field" type="date" value="' + esc(value) + '" onchange="window._ciSet(\'' + field + '\',this.value)"></div>';
}
function labelSelect(label, value, field, options) {
  var opts = options.map(function(o) {
    return '<option value="' + o[0] + '"' + (value === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('');
  return '<div><div class="form-label">' + label + '</div><select class="input-field" onchange="window._ciSet(\'' + field + '\',this.value)">' + opts + '</select></div>';
}
